<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#89b4fa"/>
      <stop offset="100%" stop-color="#b4befe"/>
    </linearGradient>
    <linearGradient id="gray-ramp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#11111b"/>
      <stop offset="50%" stop-color="#7f849c"/>
      <stop offset="100%" stop-color="#cdd6f4"/>
    </linearGradient>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="100" fill="url(#bg)" stroke="#313244" stroke-width="12"/>
  
  <!-- Image Frame -->
  <rect x="76" y="86" width="360" height="260" rx="28" fill="#181825" stroke="url(#primary)" stroke-width="14"/>
  
  <!-- Mountain graphic -->
  <path d="M110 300 L210 180 L280 250 L340 190 L402 300 Z" fill="#313244"/>
  <circle cx="170" cy="155" r="28" fill="url(#primary)"/>
  
  <!-- 8-Bit Grayscale Ramp Badge -->
  <rect x="76" y="376" width="360" height="50" rx="16" fill="url(#gray-ramp)" stroke="#45475a" stroke-width="6"/>
  <text x="256" y="410" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="800" fill="#11111b" text-anchor="middle" letter-spacing="4">8-BIT GRAYSCALE</text>
</svg>
